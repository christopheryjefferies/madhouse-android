name: Build Madhouse app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Sync app shell
        run: npx cap sync android

      - name: Unpack signing key
        env:
          KEYSTORE_B64: ${{ secrets.MH_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::The MH_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/madhouse.jks"
          echo "MH_KEYSTORE=$RUNNER_TEMP/madhouse.jks" >> "$GITHUB_ENV"

      - name: Build APK and Play bundle
        working-directory: android
        env:
          MH_STORE_PASSWORD: ${{ secrets.MH_STORE_PASSWORD }}
          MH_KEY_PASSWORD: ${{ secrets.MH_STORE_PASSWORD }}
          MH_KEY_ALIAS: madhouse
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk ../madhouse.apk
          cp app/build/outputs/bundle/release/app-release.aab ../madhouse.aab

      - uses: actions/upload-artifact@v4
        with:
          name: madhouse-app-${{ github.run_number }}
          path: |
            madhouse.apk
            madhouse.aab
